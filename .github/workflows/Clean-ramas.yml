name: Cleanup old branches

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Eliminar todas las ramas excepto las indicadas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=(
            "main"
            "master"
            "libbox-full-cache"
            "codex/clean-repository-by-removing-unnecessary-files-u8nqf4"
          )

          git ls-remote --heads https://x-access-token:${GH_TOKEN}@github.com/AnonyProArg/Tre.git \
            | awk '{print $2}' \
            | sed 's|refs/heads/||' \
            | while read branch; do
                keep=false
                for k in "${KEEP[@]}"; do
                  if [ "$branch" = "$k" ]; then
                    keep=true
                    break
                  fi
                done

                if [ "$keep" = true ]; then
                  echo "Conservando: $branch"
                else
                  echo "Eliminando:  $branch"
                  git push https://x-access-token:${GH_TOKEN}@github.com/AnonyProArg/Tre.git --delete "$branch" || echo "  (fallo: $branch)"
                fi
              done
