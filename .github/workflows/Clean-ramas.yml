name: Cleanup Codex Branches

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Eliminar solo las ramas de codex/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: "AnonyProArg/Tre"
        run: |
          echo "Obteniendo lista de ramas..."

          branches=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/branches?per_page=100" \
            | grep '"name"' | sed 's/.*"name": "\(.*\)".*/\1/')

          for branch in $branches; do
            if [[ "$branch" == codex/* ]]; then
              echo "Eliminando: $branch"
              curl -s -X DELETE \
                -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/git/refs/heads/$branch"
              echo "  OK"
            else
              echo "Conservando: $branch"
            fi
          done
