name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-libbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.13.2
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r28
        run: |
          sdkmanager "ndk;28.1.13356709"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.1.13356709" >> $GITHUB_ENV

      - name: Install gomobile (SagerNet fork)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize gomobile
        run: gomobile init

      - name: Build libbox.aar
        run: go run ./cmd/internal/build_libbox --target android

      - name: Upload libbox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libbox-v1.13.2
          path: |
            libbox.aar
            libbox-sources.jar
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    needs: build-libbox

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download libbox artifacts
        uses: actions/download-artifact@v4
        with:
          name: libbox-v1.13.2
          path: app/libs/libbox/

      - name: Verify libbox files
        run: |
          echo "=== Archivos en app/libs/libbox/ ==="
          ls -lh app/libs/libbox/

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
