name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack sing-box native binary for jniLibs
        run: |
          set -euxo pipefail
          ARCHIVE_PATH="sing-box-1.13.2-android-arm64.tar.gz"
          TARGET_DIR="app/src/main/jniLibs/arm64-v8a"
          TMP_DIR="$(mktemp -d)"

          mkdir -p "$TARGET_DIR"
          tar -xzf "$ARCHIVE_PATH" -C "$TMP_DIR"

          cp "$TMP_DIR/sing-box-1.13.2-android-arm64/sing-box" "$TARGET_DIR/libsingbox.so"
          chmod 0644 "$TARGET_DIR/libsingbox.so"

          echo "Contenido final en $TARGET_DIR:"
          ls -lah "$TARGET_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
