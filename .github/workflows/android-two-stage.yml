name: android-two-stage

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  stage1-build-libbox-aar:
    name: Stage 1 - Build official libbox AAR (engine only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Build AARs from official sing-box upstream
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          SING_BOX_REF: dev-next
        run: |
          ./scripts/build_libbox_from_official.sh

      - name: Upload libbox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: third_party/libbox/*.aar

  stage2-build-android-app:
    name: Stage 2 - Build app with libbox AAR
    runs-on: ubuntu-latest
    needs: stage1-build-libbox-aar
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download stage1 artifact
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: third_party/libbox

      - name: Sync AAR to app/libs
        run: ./scripts/sync_libbox_to_app.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
