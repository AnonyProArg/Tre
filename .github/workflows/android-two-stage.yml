name: android-two-stage

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  stage1-prepare-singbox-binary:
    name: Stage 1 - Prepare local sing-box binary (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Verify uploaded tarball exists
        run: |
          test -f third_party/uploads/sing-box-1.13.2-android-arm64.tar.gz

      - name: Extract and prepare sing-box binary
        run: ./scripts/build_libbox_from_official.sh

      - name: Upload prepared binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: singbox-bin-arm64
          path: third_party/sing-box/arm64-v8a/sing-box

  stage2-build-android-app:
    name: Stage 2 - Build app with sing-box arm64 binary
    runs-on: ubuntu-latest
    needs: stage1-prepare-singbox-binary
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download stage1 artifact
        uses: actions/download-artifact@v4
        with:
          name: singbox-bin-arm64
          path: third_party/sing-box/arm64-v8a

      - name: Sync binary to assets
        run: ./scripts/sync_libbox_to_app.sh

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
