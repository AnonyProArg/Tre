name: android-two-stage

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  stage1-prepare-singbox-binaries:
    name: Stage 1 - Prepare sing-box executable binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Prepare official sing-box binaries
        env:
          SINGBOX_VERSION: 1.13.6
        run: |
          ./scripts/build_libbox_from_official.sh

      - name: Upload sing-box artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singbox-bin
          path: third_party/sing-box/**/sing-box

  stage2-build-android-app:
    name: Stage 2 - Build app with sing-box binary
    runs-on: ubuntu-latest
    needs: stage1-prepare-singbox-binaries
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download stage1 artifact
        uses: actions/download-artifact@v4
        with:
          name: singbox-bin
          path: third_party/sing-box

      - name: Fix artifact structure
        run: |
          mkdir -p third_party/sing-box/arm64-v8a third_party/sing-box/x86_64
          if [ -f third_party/sing-box/sing-box ]; then
            cp third_party/sing-box/sing-box third_party/sing-box/arm64-v8a/sing-box
            cp third_party/sing-box/sing-box third_party/sing-box/x86_64/sing-box
          fi

      - name: Sync binaries to assets
        run: ./scripts/sync_libbox_to_app.sh

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
