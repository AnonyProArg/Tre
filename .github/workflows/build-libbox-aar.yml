name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version tag (e.g. v1.13.2)'
        required: true
        default: 'v1.13.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install gomobile (SagerNet fork)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize gomobile
        run: gomobile init

      - name: Patch build tags
        run: |
          echo "=== Tags originales ==="
          grep -n "sharedTags" ./cmd/internal/build_libbox/main.go | head -5

          python3 - << 'PYEOF'
          with open('./cmd/internal/build_libbox/main.go', 'r') as f:
              content = f.read()

          remove_tags = [
              'with_quic',
              'with_dhcp',
              'with_acme',
              'with_clash_api',
              'with_tailscale',
              'with_wireguard',
              'with_ccm',
              'with_ocm',
              'with_naive_outbound',
          ]

          for tag in remove_tags:
              content = content.replace(f'"{tag}", ', '')
              content = content.replace(f', "{tag}"', '')
              content = content.replace(f'"{tag}"', '')

          lines = content.split('\n')
          lines = [l for l in lines if 'ts_omit' not in l]
          content = '\n'.join(lines)

          with open('./cmd/internal/build_libbox/main.go', 'w') as f:
              f.write(content)

          print("Parche aplicado")
          PYEOF

          echo "=== Tags despues del parche ==="
          grep -n "sharedTags\|with_" ./cmd/internal/build_libbox/main.go | head -10

      - name: Build libbox.aar
        run: |
          go run ./cmd/internal/build_libbox --target android

      - name: Find output files
        run: |
          find . -name "*.aar" -o -name "*.jar" 2>/dev/null | grep -v "/.git/"

      - name: Upload libbox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libbox-vless-${{ github.event.inputs.version }}
          path: |
            **/libbox*.aar
            **/libbox*.jar
          if-no-files-found: warn
