name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version tag (e.g. v1.13.2)'
        required: true
        default: 'v1.13.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install gomobile (SagerNet fork)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize gomobile
        run: gomobile init

      - name: Build libbox.aar (VLESS + TUN only)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          # Tags minimos: TUN stack (gvisor) + utls para TLS fingerprinting
          # Sin: quic, wireguard, tailscale, dhcp, acme, clash_api, ccm, ocm
          # VLESS esta en el core, no necesita tag
          go run ./cmd/internal/build_libbox \
            --target android \
            -extra-tags with_gvisor,with_utls,badlinkname

      - name: Find output files
        run: |
          echo "=== Archivos .aar encontrados ==="
          find . -name "*.aar" 2>/dev/null
          echo "=== Archivos .jar encontrados ==="
          find . -name "*.jar" 2>/dev/null

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-vless-${{ github.event.inputs.version }}
          path: |
            **/*.aar
            **/*.jar
          if-no-files-found: warn
