name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version tag (e.g. v1.13.2)'
        required: true
        default: 'v1.13.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install gomobile (SagerNet fork)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize gomobile
        run: gomobile init

      - name: Get version
        id: version
        run: |
          VERSION=$(CGO_ENABLED=0 go run github.com/sagernet/sing-box/cmd/internal/read_tag@${{ github.event.inputs.version }} 2>/dev/null || echo "${{ github.event.inputs.version }}")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build libbox.aar
        run: |
          go run ./cmd/internal/build_libbox \
            --target android

      - name: Rename output
        run: |
          ls -la *.aar *.jar 2>/dev/null || true
          find . -name "*.aar" | head -5

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ github.event.inputs.version }}
          path: |
            *.aar
            *.jar
          if-no-files-found: warn

      - name: Upload to Release (opcional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.aar
            *.jar
            
