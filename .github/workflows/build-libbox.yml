name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version tag (e.g. v1.13.2)'
        required: true
        default: 'v1.13.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install gomobile (SagerNet fork)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize gomobile
        run: gomobile init

      - name: Show go.mod cronet dependency
        run: |
          echo "=== cronet-go en go.mod ==="
          grep -n "cronet" go.mod go.sum 2>/dev/null | head -10 || true
          echo "=== Quien importa cronet ==="
          grep -rn "cronet" --include="*.go" . | grep -v "_test.go" | grep "import\|cronet" | head -20 || true

      - name: Patch build tags
        run: |
          echo "=== Tags originales ==="
          grep -n "sharedTags\|with_quic\|with_tail\|with_wire" ./cmd/internal/build_libbox/main.go | head -10

          sed -i 's/with_quic,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_dhcp,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_acme,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_clash_api,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_tailscale,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_wireguard,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_ccm,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_ocm,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i '/ts_omit/d' ./cmd/internal/build_libbox/main.go

          echo "=== Tags después del parche ==="
          grep -n "sharedTags\|with_" ./cmd/internal/build_libbox/main.go | head -10

      - name: Remove cronet-go from go.mod
        run: |
          # cronet-go solo lo usa with_quic (HTTP/3) que ya no necesitamos
          # Lo excluimos del módulo
          go mod edit -droprequire github.com/sagernet/cronet-go 2>/dev/null || true
          # También excluir cualquier replace que lo mencione
          grep "cronet" go.mod || echo "cronet-go no está en go.mod directo"
          # Limpiar dependencias
          go mod tidy -e 2>/dev/null || true
          echo "=== go.mod después ==="
          grep "cronet" go.mod || echo "cronet-go eliminado correctamente"

      - name: Build libbox.aar
        run: |
          go run ./cmd/internal/build_libbox --target android

      - name: Find output files
        run: |
          find . -name "*.aar" -o -name "*.jar" 2>/dev/null | grep -v "/.git/"

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-vless-${{ github.event.inputs.version }}
          path: |
            **/*.aar
            **/*.jar
          if-no-files-found: warn
