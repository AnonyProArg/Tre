name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version tag (e.g. v1.13.2)'
        required: true
        default: 'v1.13.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install gomobile (SagerNet fork)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize gomobile
        run: gomobile init

      - name: Show and patch build tags
        run: |
          echo "=== build_libbox/main.go tags originales ==="
          grep -n "tags\|with_quic\|with_tail\|with_wire\|with_gvisor\|with_utls\|with_dhcp\|with_acme\|with_clash\|with_ccm\|with_ocm" \
            ./cmd/internal/build_libbox/main.go || true

          echo ""
          echo "=== Parcheando: eliminando tags innecesarios ==="
          # Quitar tags que causan problemas o no necesitamos
          sed -i 's/with_quic,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_dhcp,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_acme,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_clash_api,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_tailscale,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_wireguard,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_ccm,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/with_ocm,\?//g' ./cmd/internal/build_libbox/main.go
          sed -i 's/ts_omit[a-z_]*,\?//g' ./cmd/internal/build_libbox/main.go

          echo ""
          echo "=== Tags después del parche ==="
          grep -n "tags\|with_" ./cmd/internal/build_libbox/main.go || true

      - name: Build libbox.aar
        run: |
          go run ./cmd/internal/build_libbox --target android

      - name: Find output files
        run: |
          echo "=== Archivos generados ==="
          find . -name "*.aar" -o -name "*.jar" 2>/dev/null | grep -v "/.git/"

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-vless-${{ github.event.inputs.version }}
          path: |
            **/*.aar
            **/*.jar
          if-no-files-found: warn
