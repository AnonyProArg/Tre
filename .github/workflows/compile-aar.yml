name: 📦 Build sing-box AAR (libbox)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Branch/Tag de sing-box (ej: stable, main, v1.10.0)'
        required: false
        default: 'stable'
        type: string

  schedule:
    - cron: '0 6 * * *'  # Chequea nuevas versiones cada día a las 6am UTC

  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sing-box-aar.yml'

env:
  SINGBOX_REPO: SagerNet/sing-box
  SINGBOX_BRANCH: ${{ github.event.inputs.version || 'stable' }}
  GO_VERSION: '1.22'
  JAVA_VERSION: '17'
  NDK_VERSION: '26.3.11579264'
  # Android API level mínimo
  ANDROID_MIN_SDK: '21'

jobs:
  # ──────────────────────────────────────────────────────
  # JOB 1: Detectar versión de sing-box
  # ──────────────────────────────────────────────────────
  check-version:
    name: 🔍 Detectar versión
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.get_version.outputs.tag }}
      should_build: ${{ steps.compare.outputs.build }}

    steps:
      - name: Obtener último tag de sing-box
        id: get_version
        run: |
          TAG=$(curl -s https://api.github.com/repos/${{ env.SINGBOX_REPO }}/releases/latest \
            | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "🏷️ Última versión: $TAG"

      - name: Comparar con build anterior
        id: compare
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.get_version.outputs.tag }}-aar" \
            | jq -r '.tag_name // empty')

          if [ -z "$EXISTING" ]; then
            echo "✅ Nueva versión disponible, se procederá a compilar"
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Ya existe AAR para ${{ steps.get_version.outputs.tag }}, saltando"
            echo "build=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────────────
  # JOB 2: Compilar libbox como .aar
  # ──────────────────────────────────────────────────────
  build-aar:
    name: 🏗️ Compilar libbox.aar
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      # ── 1. Clonar sing-box desde el repo oficial ──────
      - name: 📥 Clonar sing-box (rama ${{ env.SINGBOX_BRANCH }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SINGBOX_REPO }}
          ref: ${{ env.SINGBOX_BRANCH }}
          fetch-depth: 1

      # ── 2. Go ─────────────────────────────────────────
      - name: 🔧 Configurar Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # ── 3. Java (necesario para el toolchain Android) ─
      - name: ☕ Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ── 4. Android SDK + NDK ──────────────────────────
      - name: 🤖 Configurar Android SDK y NDK
        uses: android-actions/setup-android@v3

      - name: 📲 Instalar Android NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      # ── 5. gomobile ───────────────────────────────────
      - name: 📱 Instalar gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # ── 6. Verificar entorno ──────────────────────────
      - name: 📋 Info del entorno
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Go:          $(go version)"
          echo "  Java:        $(java -version 2>&1 | head -1)"
          echo "  gomobile:    $(gomobile version 2>/dev/null || echo 'instalado')"
          echo "  NDK:         $ANDROID_NDK_HOME"
          echo "  Rama:        ${{ env.SINGBOX_BRANCH }}"
          echo "  Min SDK:     ${{ env.ANDROID_MIN_SDK }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── 7. Descargar dependencias Go ──────────────────
      - name: 📦 Descargar dependencias
        run: go mod download

      # ── 8. Detectar ruta de libbox ────────────────────
      - name: 🔍 Localizar paquete libbox
        id: libbox_path
        run: |
          # sing-box expone libbox en experimental/libbox o box/experimental/libbox
          # según la versión. Detectamos automáticamente.
          LIBBOX_PKG=""
          for candidate in \
            "experimental/libbox" \
            "experimental/libbox/..." \
            "./experimental/libbox"; do
            if [ -d "experimental/libbox" ]; then
              LIBBOX_PKG="./experimental/libbox"
              break
            fi
          done

          if [ -z "$LIBBOX_PKG" ]; then
            echo "⚠️  No se encontró experimental/libbox, buscando alternativas..."
            find . -name "*.go" | xargs grep -l "gomobile" 2>/dev/null | head -5
            # Intentar con el módulo raíz si libbox está embebido
            LIBBOX_PKG="."
          fi

          echo "pkg=$LIBBOX_PKG" >> $GITHUB_OUTPUT
          echo "📍 Paquete libbox: $LIBBOX_PKG"

      # ── 9. Compilar el .aar con gomobile bind ─────────
      - name: 🔨 Compilar libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)

          echo "📌 Compilando versión: $VERSION ($COMMIT)"

          # Tags de features para sing-box (mismos que en build nativo)
          BUILD_TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_ech,with_utls,with_reality_server,with_clash_api,with_v2ray_api,with_acme"

          # Flags de linker
          LDFLAGS="-s -w \
            -X github.com/sagernet/sing-box/constant.Version=${VERSION} \
            -X github.com/sagernet/sing-box/constant.Commit=${COMMIT}"

          # gomobile bind genera:
          #   libbox.aar     → biblioteca para Android (incluye JNI + Go runtime)
          #   libbox-sources.jar → fuentes Java/Kotlin generadas por gobind
          gomobile bind \
            -v \
            -target android \
            -androidapi ${{ env.ANDROID_MIN_SDK }} \
            -tags "${BUILD_TAGS}" \
            -ldflags "${LDFLAGS}" \
            -o libbox.aar \
            ${{ steps.libbox_path.outputs.pkg }}

          echo "✅ Compilación exitosa"
          ls -lh libbox.aar libbox-sources.jar 2>/dev/null

      # ── 10. Información del .aar generado ─────────────
      - name: 🔎 Inspeccionar contenido del AAR
        run: |
          echo "📦 Estructura del AAR:"
          unzip -l libbox.aar | head -40

          echo ""
          echo "📐 Tamaños por arquitectura:"
          unzip -p libbox.aar "jni/*/*.so" > /dev/null 2>&1 || true
          unzip libbox.aar "jni/**" -d aar_contents 2>/dev/null || true
          find aar_contents -name "*.so" -exec ls -lh {} \; 2>/dev/null || true

      # ── 11. Generar checksums ─────────────────────────
      - name: 🔐 Generar checksums SHA256
        run: |
          sha256sum libbox.aar > libbox.aar.sha256
          [ -f libbox-sources.jar ] && sha256sum libbox-sources.jar > libbox-sources.jar.sha256 || true
          cat libbox.aar.sha256

      # ── 12. Subir artefactos ──────────────────────────
      - name: 📤 Subir AAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-libbox-aar
          path: |
            libbox.aar
            libbox.aar.sha256
            libbox-sources.jar
            libbox-sources.jar.sha256
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # JOB 3: Publicar Release con el .aar
  # ──────────────────────────────────────────────────────
  release:
    name: 🚀 Publicar Release
    runs-on: ubuntu-latest
    needs: [check-version, build-aar]
    if: always() && needs.build-aar.result == 'success'
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          name: sing-box-libbox-aar
          path: ./artifacts

      - name: 📋 Listar artefactos
        run: find ./artifacts -type f | sort

      - name: 🚀 Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}-aar
          name: "sing-box ${{ needs.check-version.outputs.latest_tag }} — libbox AAR"
          body: |
            ## 📦 sing-box libbox — Android AAR

            **Versión upstream:** [`${{ needs.check-version.outputs.latest_tag }}`](https://github.com/SagerNet/sing-box/releases/tag/${{ needs.check-version.outputs.latest_tag }})
            **Compilado el:** ${{ github.run_id && 'ver Actions' || '' }}
            **Rama:** `${{ env.SINGBOX_BRANCH }}`
            **Android Min SDK:** API ${{ env.ANDROID_MIN_SDK }}

            ---

            ### ✅ Features incluidas en el AAR
            | Feature | Estado |
            |---------|--------|
            | `with_gvisor` | ✅ |
            | `with_quic` | ✅ |
            | `with_dhcp` | ✅ |
            | `with_wireguard` | ✅ |
            | `with_ech` | ✅ |
            | `with_utls` | ✅ |
            | `with_reality_server` | ✅ |
            | `with_clash_api` | ✅ |
            | `with_v2ray_api` | ✅ |
            | `with_acme` | ✅ |

            ---

            ### 📥 Cómo usar el AAR en tu proyecto Android

            #### Gradle (módulo local)
            ```groovy
            // settings.gradle
            // Copia libbox.aar a tu carpeta app/libs/

            // app/build.gradle
            dependencies {
                implementation fileTree(dir: 'libs', include: ['*.aar'])
            }
            ```

            #### Kotlin/Java — importar libbox
            ```kotlin
            import go.Seq
            import libbox.Libbox

            // Inicializar en Application.onCreate()
            Seq.setContext(applicationContext)
            ```

            ---

            ### 🔐 Verificar integridad
            ```bash
            sha256sum -c libbox.aar.sha256
            ```

            > ⚠️ Build no oficial. Código fuente: [SagerNet/sing-box](https://github.com/SagerNet/sing-box)
          files: ./artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
