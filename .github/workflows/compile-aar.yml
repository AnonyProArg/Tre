name: 📦 Build sing-box AAR (libbox)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Branch/Tag de sing-box (ej: stable, main, v1.10.0)'
        required: false
        default: 'stable'
        type: string

  schedule:
    - cron: '0 6 * * *'

  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sing-box-aar.yml'

env:
  SINGBOX_REPO: SagerNet/sing-box
  SINGBOX_BRANCH: ${{ github.event.inputs.version || 'stable' }}
  JAVA_VERSION: '17'
  NDK_VERSION: '26.3.11579264'
  ANDROID_MIN_SDK: '21'

jobs:
  # ──────────────────────────────────────────────────────
  # JOB 1: Detectar versión
  # ──────────────────────────────────────────────────────
  check-version:
    name: 🔍 Detectar versión
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.get_version.outputs.tag }}
      should_build: ${{ steps.compare.outputs.build }}

    steps:
      - name: Obtener último tag de sing-box
        id: get_version
        run: |
          TAG=$(curl -s https://api.github.com/repos/${{ env.SINGBOX_REPO }}/releases/latest \
            | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "🏷️ Última versión: $TAG"

      - name: Comparar con build anterior
        id: compare
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.get_version.outputs.tag }}-aar" \
            | jq -r '.tag_name // empty')
          if [ -z "$EXISTING" ]; then
            echo "✅ Nueva versión disponible"
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Ya existe AAR para esta versión"
            echo "build=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────────────
  # JOB 2: Compilar libbox.aar
  # ──────────────────────────────────────────────────────
  build-aar:
    name: 🏗️ Compilar libbox.aar
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      # ── 1. Clonar sing-box ────────────────────────────
      - name: 📥 Clonar sing-box (rama ${{ env.SINGBOX_BRANCH }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SINGBOX_REPO }}
          ref: ${{ env.SINGBOX_BRANCH }}
          fetch-depth: 1

      # ── 2. Leer versión de Go del go.mod de sing-box ──
      - name: 🔍 Detectar versión de Go requerida
        id: go_version
        run: |
          GO_VER=$(grep '^go ' go.mod | awk '{print $2}')
          echo "version=$GO_VER" >> $GITHUB_OUTPUT
          echo "📌 Go requerido: $GO_VER"

      # ── 3. Instalar la versión EXACTA de Go ──────────
      - name: 🔧 Configurar Go ${{ steps.go_version.outputs.version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go_version.outputs.version }}
          cache: true
          cache-dependency-path: go.sum

      # ── 4. Java ───────────────────────────────────────
      - name: ☕ Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ── 5. Android SDK + NDK ──────────────────────────
      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📲 Instalar NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      # ── 6. Instalar gomobile correctamente ────────────
      #
      # FIX del error anterior:
      # El problema era que `go install` no agrega el bin
      # al PATH para steps siguientes. Aquí lo resolvemos
      # exportando GOPATH/bin explícitamente Y usando la
      # ruta absoluta $GOBIN/gomobile al ejecutar.
      #
      # Además, gomobile@latest puede requerir Go >= 1.25
      # si sing-box usa una versión anterior. Por eso
      # usamos `go run` con el módulo correcto de x/mobile
      # que ya está en el go.sum del proyecto.
      # ──────────────────────────────────────────────────
      - name: 📱 Instalar gomobile y gobind
        run: |
          export GOPATH=$(go env GOPATH)
          export GOBIN=$GOPATH/bin

          # Instalar usando go install con @latest
          # (compatible con la versión de Go detectada)
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest

          # Exportar GOBIN para todos los steps siguientes
          echo "$GOBIN" >> $GITHUB_PATH
          echo "GOBIN=$GOBIN" >> $GITHUB_ENV

          # Inicializar gomobile con el NDK ya instalado
          $GOBIN/gomobile init

          echo "✅ gomobile instalado en: $GOBIN/gomobile"
          $GOBIN/gomobile version || echo "(versión no reportada, binario existe)"

      # ── 7. Info del entorno ───────────────────────────
      - name: 📋 Info del entorno
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Go:       $(go version)"
          echo "  Java:     $(java -version 2>&1 | head -1)"
          echo "  gomobile: $($GOBIN/gomobile version 2>/dev/null || echo 'ok')"
          echo "  NDK:      $ANDROID_NDK_HOME"
          echo "  Rama:     ${{ env.SINGBOX_BRANCH }}"
          echo "  Min SDK:  ${{ env.ANDROID_MIN_SDK }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── 8. Descargar dependencias ─────────────────────
      - name: 📦 Descargar dependencias Go
        run: go mod download

      # ── 9. Verificar que libbox existe ────────────────
      - name: 🔍 Localizar paquete libbox
        id: libbox_path
        run: |
          if [ -d "experimental/libbox" ]; then
            echo "pkg=./experimental/libbox" >> $GITHUB_OUTPUT
            echo "📍 Encontrado: ./experimental/libbox"
            ls experimental/libbox/*.go | head -5
          else
            echo "❌ No se encontró experimental/libbox"
            find . -maxdepth 4 -name "*.go" | xargs grep -l "gomobile\|ExportedForMobile" 2>/dev/null | head -5
            exit 1
          fi

      # ── 10. Compilar AAR ──────────────────────────────
      - name: 🔨 Compilar libbox.aar
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          echo "📌 Versión: $VERSION ($COMMIT)"

          BUILD_TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_ech,with_utls,with_reality_server,with_clash_api,with_v2ray_api,with_acme"

          LDFLAGS="-s -w \
            -X github.com/sagernet/sing-box/constant.Version=${VERSION} \
            -X github.com/sagernet/sing-box/constant.Commit=${COMMIT}"

          # Usar ruta absoluta al binario de gomobile
          $GOBIN/gomobile bind \
            -v \
            -target android \
            -androidapi ${{ env.ANDROID_MIN_SDK }} \
            -tags "${BUILD_TAGS}" \
            -ldflags "${LDFLAGS}" \
            -o libbox.aar \
            ${{ steps.libbox_path.outputs.pkg }}

          echo ""
          echo "✅ Build completado:"
          ls -lh libbox.aar libbox-sources.jar 2>/dev/null

      # ── 11. Inspeccionar AAR ──────────────────────────
      - name: 🔎 Inspeccionar contenido del AAR
        run: |
          echo "📦 Librerías nativas incluidas:"
          unzip -l libbox.aar | grep '\.so' || true
          echo ""
          echo "📐 Tamaño total: $(du -sh libbox.aar | cut -f1)"

      # ── 12. Checksums ─────────────────────────────────
      - name: 🔐 Generar checksums SHA256
        run: |
          sha256sum libbox.aar > libbox.aar.sha256
          [ -f libbox-sources.jar ] && sha256sum libbox-sources.jar > libbox-sources.jar.sha256 || true
          cat libbox.aar.sha256

      # ── 13. Subir artefacto ───────────────────────────
      - name: 📤 Subir AAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-libbox-aar
          path: |
            libbox.aar
            libbox.aar.sha256
            libbox-sources.jar
            libbox-sources.jar.sha256
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # JOB 3: Release
  # ──────────────────────────────────────────────────────
  release:
    name: 🚀 Publicar Release
    runs-on: ubuntu-latest
    needs: [check-version, build-aar]
    if: always() && needs.build-aar.result == 'success'
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          name: sing-box-libbox-aar
          path: ./artifacts

      - name: 🚀 Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}-aar
          name: "sing-box ${{ needs.check-version.outputs.latest_tag }} — libbox AAR"
          body: |
            ## 📦 sing-box libbox — Android AAR

            **Versión upstream:** [`${{ needs.check-version.outputs.latest_tag }}`](https://github.com/SagerNet/sing-box/releases/tag/${{ needs.check-version.outputs.latest_tag }})
            **Rama:** `${{ env.SINGBOX_BRANCH }}`
            **Android Min SDK:** API ${{ env.ANDROID_MIN_SDK }}

            ### ✅ Features incluidas
            `with_gvisor` · `with_quic` · `with_dhcp` · `with_wireguard` · `with_ech` · `with_utls` · `with_reality_server` · `with_clash_api` · `with_v2ray_api` · `with_acme`

            ### 📥 Uso en Android (Gradle)
            ```groovy
            // Copia libbox.aar a app/libs/
            dependencies {
                implementation fileTree(dir: 'libs', include: ['*.aar'])
            }
            ```

            ### 🔐 Verificar integridad
            ```bash
            sha256sum -c libbox.aar.sha256
            ```

            > ⚠️ Build no oficial. Fuente: [SagerNet/sing-box](https://github.com/SagerNet/sing-box)
          files: ./artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
