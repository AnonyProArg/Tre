name: Build Sing-box Android AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Stable Sing-box
        run: |
          git clone --recursive --branch stable https://github.com .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Build Official AAR
        run: |
          gomobile bind -v -androidapi 21 -target android/arm,android/arm64 -ldflags "-s -w" ./constant

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-stable-lib
          path: "*.aar"
